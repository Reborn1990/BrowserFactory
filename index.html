<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Factory-Sim: Modular</title>
    <style>
        :root { --bg: #121212; --panel: #252525; --accent: #ff9f1c; --text: #e0e0e0; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background: #000; border: 3px solid #333; image-rendering: pixelated; }
        .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 4px; border-left: 4px solid var(--accent); pointer-events: none; min-width: 220px; }
        .build-bar { margin-top: 20px; display: flex; gap: 8px; background: var(--panel); padding: 12px; border-radius: 8px; }
        button { background: #333; color: #aaa; border: 1px solid #444; padding: 10px 16px; cursor: pointer; border-radius: 4px; }
        button.active { background: var(--accent); color: #000; border-color: #fff; font-weight: bold; }
        .hotkey { font-size: 10px; display: block; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="hud">
        <div id="status-line" style="font-weight: bold; color: var(--accent); margin-bottom: 5px;">INTERACT | DIR: EAST</div>
        <div id="inv-display" style="font-family: monospace; font-size: 14px;"></div>
    </div>

    <canvas id="gameCanvas" width="960" height="640"></canvas>

    <div class="build-bar">
        <button id="btn-interact" class="active" onclick="window.setTool('interact')">Interact <span class="hotkey">[I]</span></button>
        <button id="btn-belt" onclick="window.setTool('belt')">Belt <span class="hotkey">[B]</span></button>
        <button id="btn-miner" onclick="window.setTool('miner')">Miner <span class="hotkey">[M]</span></button>
        <button id="btn-smelter" onclick="window.setTool('smelter')">Smelter <span class="hotkey">[S]</span></button>
        <button id="btn-delete" onclick="window.setTool('delete')" style="color: #ff5555;">Delete <span class="hotkey">[X]</span></button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
